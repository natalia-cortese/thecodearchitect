<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLID_ARCH — Score Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #050a05;
  --panel:   #080e08;
  --border:  #152015;
  --green:   #00ff88;
  --cyan:    #00e5ff;
  --dim:     #1a3a1a;
  --text:    #b8d8b8;
  --muted:   #3a5a3a;
  --danger:  #ff2255;
  --mono:    'Share Tech Mono', monospace;
  --display: 'VT323', monospace;
}

html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  min-height: 100vh;
  overflow-x: hidden;
  cursor: default;
}

/* CRT scanlines */
body::before {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 9999;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,0,0,.07) 2px, rgba(0,0,0,.07) 4px
  );
}

#root {
  max-width: 940px;
  margin: 0 auto;
  padding: 28px 18px 60px;
  position: relative; z-index: 1;
}

/* ── HEADER ── */
.hdr {
  display: flex; align-items: flex-start; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  padding-bottom: 18px; margin-bottom: 32px;
  flex-wrap: wrap; gap: 12px;
}
.logo {
  font-family: var(--display);
  font-size: 38px; letter-spacing: 5px; line-height: 1;
  color: var(--green);
  text-shadow: 0 0 24px rgba(0,255,136,.45);
}
.logo span { color: var(--cyan); }
.sys-info { font-size: 10px; color: var(--muted); letter-spacing: 2px; margin-top: 4px; }

.user-pill {
  display: flex; align-items: center; gap: 10px;
  font-size: 12px; color: var(--green);
}
.online-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green); box-shadow: 0 0 8px var(--green);
  animation: blink 1.6s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.15} }

.btn-sm {
  background: transparent; border: 1px solid var(--muted);
  color: var(--muted); font-family: var(--mono); font-size: 10px;
  letter-spacing: 2px; padding: 4px 10px; cursor: pointer;
  transition: all .2s;
}
.btn-sm:hover { border-color: var(--text); color: var(--text); }

/* ── LOGIN ── */
.login-wrap {
  display: flex; align-items: center; justify-content: center;
  min-height: 68vh;
}
.login-box {
  width: 100%; max-width: 400px;
  border: 1px solid var(--green);
  padding: 42px 38px;
  background: var(--panel);
  box-shadow: 0 0 48px rgba(0,255,136,.08),
              inset 0 0 48px rgba(0,255,136,.015);
}
.login-title {
  font-family: var(--display);
  font-size: 30px; color: var(--green); letter-spacing: 3px; margin-bottom: 4px;
  text-shadow: 0 0 14px rgba(0,255,136,.5);
}
.login-sub { font-size: 10px; color: var(--muted); letter-spacing: 3px; margin-bottom: 30px; }

.field-lbl { font-size: 10px; color: var(--muted); letter-spacing: 3px; margin-bottom: 8px; }
.input-row { display: flex; align-items: center; gap: 6px; margin-bottom: 22px; }
.prompt { color: var(--green); font-size: 15px; }
.t-input {
  flex: 1; background: transparent; border: none;
  border-bottom: 1px solid var(--dim);
  color: var(--green); font-family: var(--mono); font-size: 16px;
  padding: 7px 0; outline: none; transition: border-color .2s;
  caret-color: var(--green);
}
.t-input:focus { border-bottom-color: var(--green); }
.t-input::placeholder { color: var(--muted); }

.btn-main {
  width: 100%; background: transparent;
  border: 1px solid var(--green);
  color: var(--green); font-family: var(--mono); font-size: 12px;
  letter-spacing: 4px; padding: 13px;
  cursor: pointer; transition: all .2s; position: relative; overflow: hidden;
}
.btn-main:hover {
  background: rgba(0,255,136,.07);
  box-shadow: 0 0 22px rgba(0,255,136,.2);
}

.divider { border: none; border-top: 1px solid var(--border); margin: 22px 0; }

.prev-label { font-size: 10px; color: var(--muted); letter-spacing: 2px; margin-bottom: 10px; }
.prev-btn {
  width: 100%; background: transparent; border: 1px solid var(--border);
  color: var(--text); font-family: var(--mono); font-size: 12px;
  padding: 9px 12px; cursor: pointer; text-align: left;
  display: flex; justify-content: space-between;
  transition: all .2s; margin-bottom: 6px;
}
.prev-btn:hover { border-color: var(--dim); background: rgba(0,255,136,.04); color: var(--green); }
.prev-pts { color: var(--muted); font-size: 11px; }

.link-btn {
  background: transparent; border: none; cursor: pointer;
  color: var(--muted); font-family: var(--mono); font-size: 11px;
  text-decoration: underline; text-underline-offset: 3px;
  transition: color .2s; padding: 0;
}
.link-btn:hover { color: var(--text); }

/* ── MAIN LAYOUT ── */
.layout {
  display: grid;
  grid-template-columns: 1fr 272px;
  gap: 22px;
}
@media (max-width: 680px) { .layout { grid-template-columns: 1fr; } }

.sec-hd {
  font-size: 10px; color: var(--muted); letter-spacing: 3px;
  display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
}
.sec-hd::after { content:''; flex:1; height:1px; background:var(--border); }

/* ── LEVEL CARDS ── */
.levels { display: flex; flex-direction: column; gap: 10px; }

.lcard {
  border: 1px solid var(--border); background: var(--panel);
  padding: 15px 18px;
  display: grid; grid-template-columns: 50px 1fr 88px;
  gap: 0 14px; align-items: center;
  cursor: pointer; transition: transform .2s, border-color .2s;
  position: relative;
}
.lcard::after {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 0; transition: width .2s;
}
.lcard.avail:hover { transform: translateX(4px); }
.lcard.avail:hover::after { width: 3px; }
.lcard.locked { opacity: .38; cursor: not-allowed; }
.lcard.done { border-color: var(--dim); }

.l-letter {
  font-family: var(--display); font-size: 44px; line-height: 1;
  text-align: center; filter: drop-shadow(0 0 9px currentColor);
}
.l-name {
  font-size: 12px; letter-spacing: 1px; margin-bottom: 3px;
}
.l-desc { font-size: 11px; color: var(--muted); line-height: 1.55; }
.l-tag {
  display: inline-block; font-size: 9px; letter-spacing: 2px;
  border: 1px solid currentColor; padding: 1px 5px; margin-top: 5px;
  opacity: .6;
}

.l-score { text-align: right; }
.l-pts {
  font-family: var(--display); font-size: 30px; line-height: 1;
}
.l-pts-lbl { font-size: 9px; color: var(--muted); letter-spacing: 2px; }
.l-bar { height: 2px; background: var(--border); margin-top: 6px; border-radius: 1px; }
.l-bar-fill { height: 100%; border-radius: 1px; transition: width .8s ease; }

/* ── MODAL ── */
.modal-bg {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.88); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
}
.modal {
  width: 100%; max-width: 430px; margin: 16px;
  background: var(--panel); border: 1px solid var(--green);
  padding: 34px 38px;
  box-shadow: 0 0 64px rgba(0,255,136,.12);
  animation: up .28s ease;
}
@keyframes up { from{transform:translateY(14px);opacity:0} to{transform:none;opacity:1} }

.m-tag { font-size: 9px; color: var(--muted); letter-spacing: 3px; margin-bottom: 7px; }
.m-title {
  font-family: var(--display); font-size: 27px; color: var(--green);
  letter-spacing: 2px; margin-bottom: 3px;
}
.m-desc { font-size: 11px; color: var(--muted); margin-bottom: 22px; }

.big-score { display: flex; align-items: baseline; gap: 8px; margin-bottom: 20px; }
.big-num {
  font-family: var(--display); font-size: 68px; line-height: 1;
  text-shadow: 0 0 22px currentColor;
  transition: all .1s;
}
.big-max { font-size: 13px; color: var(--muted); }

.bar-wrap { margin-bottom: 22px; }
.bar-track { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.bar-fill {
  height: 100%; border-radius: 2px; transition: width .6s ease;
  box-shadow: 0 0 8px currentColor;
}
.bar-labels {
  display: flex; justify-content: space-between;
  font-size: 10px; color: var(--muted); margin-top: 4px;
}

.m-actions { display: flex; gap: 10px; margin-top: 6px; }
.btn-cancel-m {
  flex: 1; background: transparent; border: 1px solid var(--border);
  color: var(--muted); font-family: var(--mono); font-size: 11px;
  letter-spacing: 2px; padding: 11px; cursor: pointer; transition: all .2s;
}
.btn-cancel-m:hover { border-color: var(--dim); color: var(--text); }
.btn-save-m {
  flex: 2; background: transparent;
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 2px; padding: 11px; cursor: pointer; transition: all .2s;
}
.btn-save-m:hover { opacity: .85; box-shadow: 0 0 18px rgba(0,255,136,.2); }

/* ── SIDEBAR ── */
.sidebar { display: flex; flex-direction: column; gap: 18px; }

.sbox {
  border: 1px solid var(--border); background: var(--panel);
  padding: 18px 20px;
}

.total-num {
  font-family: var(--display); font-size: 58px; line-height: 1;
  color: var(--green);
  text-shadow: 0 0 18px rgba(0,255,136,.4);
  transition: all .4s;
}
.total-lbl { font-size: 10px; color: var(--muted); letter-spacing: 2px; margin-top: 2px; }
.lvl-done { font-size: 12px; color: var(--muted); margin-top: 8px; }
.lvl-done b { color: var(--green); }

.solid-bar { display: flex; gap: 4px; margin-top: 14px; }
.sdot {
  flex: 1; height: 3px; background: var(--border); border-radius: 2px; transition: all .5s;
}
.sdot.on { box-shadow: 0 0 6px currentColor; }

/* ── LEADERBOARD ── */
.lb-row {
  display: grid; grid-template-columns: 22px 1fr auto;
  gap: 8px; align-items: center;
  padding: 8px 10px; border: 1px solid var(--border);
  font-size: 12px; margin-bottom: 5px; transition: all .2s;
}
.lb-row.me {
  border-color: var(--dim);
  background: rgba(0,255,136,.035);
  color: var(--green);
}
.lb-rank { font-size: 10px; color: var(--muted); text-align: right; }
.lb-nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-pts { font-family: var(--display); font-size: 22px; color: var(--green); }
.lb-empty { font-size: 11px; color: var(--muted); text-align: center; padding: 18px 0; }
.lb-note { font-size: 10px; color: var(--muted); margin-top: 10px; line-height: 1.6; }

/* ── FLASH ── */
.flash { animation: flashAnim .5s ease; }
@keyframes flashAnim { 0%,100%{opacity:1} 40%,60%{opacity:.3} }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--panel); border: 1px solid var(--green);
  color: var(--green); font-family: var(--mono); font-size: 12px;
  letter-spacing: 2px; padding: 11px 22px; z-index: 300;
  transition: transform .35s ease;
  box-shadow: 0 0 24px rgba(0,255,136,.15);
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ── HELP BOX ── */
.help-row { display: flex; gap: 6px; margin-bottom: 8px; font-size: 11px; color: var(--muted); line-height: 1.6; }
.help-row b { color: var(--text); }
</style>
</head>
<body>
<div id="root"></div>

<!-- React + Babel standalone -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ─────────────────────────────────────────────────────────────
// CONFIGURACIÓN — leaderboard compartido via JSONBin
// Para activar el leaderboard online:
//   1. Crear cuenta gratis en https://jsonbin.io
//   2. Crear un bin con contenido inicial: {}
//   3. Copiar el BIN_ID y el ACCESS_KEY aquí
// Sin configurar, el leaderboard solo guarda en localStorage.
// ─────────────────────────────────────────────────────────────
const JSONBIN_ID  = "";          // ej: "64abc123def456789"
const JSONBIN_KEY = "";          // ej: "$2a$10$abc..."
const LB_LOCAL_KEY = "solid_lb"; // fallback localStorage

// ─────────────────────────────────────────────────────────────
// Storage — localStorage para datos personales
// ─────────────────────────────────────────────────────────────
function lsGet(key, def = null) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
  catch { return def; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

// ─────────────────────────────────────────────────────────────
// Leaderboard — JSONBin si está configurado, localStorage si no
// ─────────────────────────────────────────────────────────────
async function lbLoad() {
  if (JSONBIN_ID && JSONBIN_KEY) {
    try {
      const r = await fetch(
        `https://api.jsonbin.io/v3/b/${JSONBIN_ID}/latest`,
        { headers: { "X-Access-Key": JSONBIN_KEY } }
      );
      const j = await r.json();
      return j.record || {};
    } catch { /* fallback */ }
  }
  return lsGet(LB_LOCAL_KEY, {});
}

async function lbSave(board) {
  lsSet(LB_LOCAL_KEY, board);
  if (JSONBIN_ID && JSONBIN_KEY) {
    try {
      await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Access-Key": JSONBIN_KEY,
        },
        body: JSON.stringify(board),
      });
    } catch {}
  }
}

// ─────────────────────────────────────────────────────────────
// Datos de niveles
// ─────────────────────────────────────────────────────────────
const LEVELS = [
  { id:"srp", letter:"S", name:"Single Responsibility", short:"SRP",
    color:"#00ff88", desc:"Una clase, una razón para cambiar.", maxScore:700 },
  { id:"ocp", letter:"O", name:"Open / Closed", short:"OCP",
    color:"#00e5ff", desc:"Abierta para extensión, cerrada para modificación.", maxScore:700 },
  { id:"lsp", letter:"L", name:"Liskov Substitution", short:"LSP",
    color:"#b44aff", desc:"Las subclases deben poder reemplazar a sus bases.", maxScore:700 },
  { id:"isp", letter:"I", name:"Interface Segregation", short:"ISP",
    color:"#f0a500", desc:"Interfaces específicas, no interfaces gordas.", maxScore:700 },
  { id:"dip", letter:"D", name:"Dependency Inversion", short:"DIP",
    color:"#ff2255", desc:"Dependé de abstracciones, no de concreciones.", maxScore:700 },
];
const MAX_TOTAL = LEVELS.reduce((s, l) => s + l.maxScore, 0);

// ─────────────────────────────────────────────────────────────
// Toast
// ─────────────────────────────────────────────────────────────
function Toast({ msg, show }) {
  return <div className={`toast ${show ? "show" : ""}`}>{msg}</div>;
}

// ─────────────────────────────────────────────────────────────
// Login
// ─────────────────────────────────────────────────────────────
function LoginScreen({ onLogin, prevUsers }) {
  const [name, setName] = useState("");
  const [showPrev, setShowPrev] = useState(false);

  function go() {
    const t = name.trim();
    if (t) onLogin(t);
  }

  return (
    <div className="login-wrap">
      <div className="login-box">
        <div className="login-title">IDENTIFICACIÓN</div>
        <div className="login-sub">SOLID_ARCH — SCORE TRACKER v2.0</div>

        {!showPrev ? (
          <>
            <div className="field-lbl">NOMBRE DE USUARIO</div>
            <div className="input-row">
              <span className="prompt">&gt;</span>
              <input
                className="t-input"
                placeholder="tu nombre..."
                value={name}
                maxLength={24}
                autoFocus
                onChange={e => setName(e.target.value)}
                onKeyDown={e => e.key === "Enter" && go()}
              />
            </div>
            <button className="btn-main" onClick={go}>
              [ INICIAR SESIÓN ]
            </button>
            {prevUsers.length > 0 && (
              <div style={{textAlign:"center",marginTop:14}}>
                <button className="link-btn" onClick={() => setShowPrev(true)}>
                  ver usuarios guardados →
                </button>
              </div>
            )}
          </>
        ) : (
          <>
            <div className="prev-label">USUARIOS GUARDADOS EN ESTE DISPOSITIVO</div>
            {prevUsers.map(u => (
              <button key={u.name} className="prev-btn" onClick={() => onLogin(u.name)}>
                <span>▸ {u.name}</span>
                <span className="prev-pts">{u.total} pts</span>
              </button>
            ))}
            <hr className="divider" />
            <button className="link-btn" onClick={() => setShowPrev(false)}>← nuevo usuario</button>
          </>
        )}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Score Modal
// ─────────────────────────────────────────────────────────────
function ScoreModal({ level, current, onSave, onClose }) {
  const [raw, setRaw] = useState(current > 0 ? String(current) : "");
  const pts   = Math.max(0, Math.min(level.maxScore, parseInt(raw) || 0));
  const pct   = Math.round((pts / level.maxScore) * 100);
  const lvIdx = LEVELS.findIndex(l => l.id === level.id);

  function handleBg(e) { if (e.target === e.currentTarget) onClose(); }

  return (
    <div className="modal-bg" onClick={handleBg}>
      <div className="modal">
        <div className="m-tag">NIVEL {lvIdx + 1} — {level.short}</div>
        <div className="m-title">{level.name.toUpperCase()}</div>
        <div className="m-desc">{level.desc}</div>

        <div className="big-score">
          <div className="big-num" style={{color:level.color}}>{pts}</div>
          <div className="big-max">/ {level.maxScore} pts</div>
        </div>

        <div className="bar-wrap">
          <div className="bar-track">
            <div className="bar-fill"
              style={{width:`${pct}%`,background:level.color,color:level.color}}/>
          </div>
          <div className="bar-labels">
            <span>0</span>
            <span style={{color:level.color}}>{pct}%</span>
            <span>{level.maxScore}</span>
          </div>
        </div>

        <div className="field-lbl">INGRESAR PUNTAJE OBTENIDO EN PYGAME</div>
        <div className="input-row">
          <span className="prompt" style={{color:level.color}}>&gt;</span>
          <input
            className="t-input"
            style={{color:level.color, borderBottomColor:level.color}}
            placeholder="0"
            value={raw}
            maxLength={4}
            autoFocus
            onChange={e => setRaw(e.target.value.replace(/\D/g,""))}
            onKeyDown={e => e.key === "Enter" && onSave(pts)}
          />
        </div>

        <div className="m-actions">
          <button className="btn-cancel-m" onClick={onClose}>[ CANCELAR ]</button>
          <button
            className="btn-save-m"
            style={{border:`1px solid ${level.color}`,color:level.color}}
            onClick={() => onSave(pts)}
          >
            [ GUARDAR SCORE ]
          </button>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Leaderboard panel
// ─────────────────────────────────────────────────────────────
function LeaderboardPanel({ me, board }) {
  const sorted = Object.entries(board)
    .map(([name,total]) => ({name,total}))
    .sort((a,b) => b.total - a.total)
    .slice(0, 10);

  const online = JSONBIN_ID && JSONBIN_KEY;

  return (
    <div className="sbox">
      <div className="sec-hd">LEADERBOARD{online ? " 🌐" : " 💾"}</div>
      {sorted.length === 0
        ? <div className="lb-empty">sin datos aún</div>
        : sorted.map((u,i) => (
            <div key={u.name} className={`lb-row ${u.name===me?"me":""}`}>
              <div className="lb-rank">#{i+1}</div>
              <div className="lb-nm">{u.name===me ? `▸ ${u.name}` : u.name}</div>
              <div className="lb-pts">{u.total}</div>
            </div>
          ))
      }
      <div className="lb-note">
        {online
          ? "Leaderboard compartido en tiempo real."
          : <>Sin JSONBin configurado, el leaderboard es solo local.<br/>
              Ver instrucciones en el <code style={{color:"var(--text)"}}>README</code>.</>
        }
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// App principal
// ─────────────────────────────────────────────────────────────
function App() {
  const [user, setUser]       = useState(null);   // {name, scores:{}}
  const [board, setBoard]     = useState({});
  const [prevUsers, setPrev]  = useState([]);
  const [modal, setModal]     = useState(null);
  const [loading, setLoading] = useState(true);
  const [flash, setFlash]     = useState(false);
  const [toast, setToast]     = useState({show:false, msg:""});

  function showToast(msg) {
    setToast({show:true, msg});
    setTimeout(() => setToast({show:false,msg:""}), 2600);
  }

  useEffect(() => {
    (async () => {
      const lb     = await lbLoad();
      const last   = lsGet("solid_last_user");
      const allU   = lsGet("solid_all_users", {});
      const prev   = Object.entries(allU)
        .map(([name,sc]) => ({name, total:Object.values(sc).reduce((a,b)=>a+b,0)}))
        .sort((a,b) => b.total - a.total);

      setBoard(lb);
      setPrev(prev);
      if (last && allU[last]) {
        setUser({name:last, scores:allU[last]});
      }
      setLoading(false);
    })();
  }, []);

  async function handleLogin(name) {
    const allU  = lsGet("solid_all_users", {});
    const scores = allU[name] || {};
    const newUser = {name, scores};
    setUser(newUser);
    lsSet("solid_last_user", name);
    allU[name] = scores;
    lsSet("solid_all_users", allU);

    // Refresh leaderboard
    const lb = await lbLoad();
    setBoard(lb);
  }

  async function handleSave(level, pts) {
    const newScores = {...(user.scores||{}), [level.id]: pts};
    const newTotal  = Object.values(newScores).reduce((a,b)=>a+b,0);
    const updated   = {...user, scores:newScores};

    // Persist personal
    setUser(updated);
    const allU = lsGet("solid_all_users", {});
    allU[user.name] = newScores;
    lsSet("solid_all_users", allU);
    lsSet("solid_last_user", user.name);

    // Persist leaderboard
    const lb = await lbLoad();
    lb[user.name] = newTotal;
    await lbSave(lb);
    setBoard({...lb});

    setModal(null);
    setFlash(true);
    setTimeout(() => setFlash(false), 500);
    showToast(`✓ ${level.short} — ${pts} pts guardado`);
  }

  function handleLogout() {
    lsSet("solid_last_user", null);
    setUser(null);
    // Refresh prevUsers
    const allU = lsGet("solid_all_users", {});
    const prev = Object.entries(allU)
      .map(([name,sc]) => ({name, total:Object.values(sc).reduce((a,b)=>a+b,0)}))
      .sort((a,b) => b.total - a.total);
    setPrev(prev);
  }

  const total = user ? Object.values(user.scores||{}).reduce((a,b)=>a+b,0) : 0;
  const done  = user ? Object.keys(user.scores||{}).length : 0;

  if (loading) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"80vh"}}>
      <div style={{color:"var(--muted)",fontSize:12,letterSpacing:3,
                   animation:"blink 1s infinite"}}>CARGANDO...</div>
    </div>
  );

  return (
    <>
      {/* Header */}
      <div className="hdr">
        <div>
          <div className="logo">SOLID_<span>ARCH</span></div>
          <div className="sys-info">SCORE TRACKER — PRINCIPIOS SOLID</div>
        </div>
        {user && (
          <div className="user-pill">
            <div className="online-dot"/>
            <span>{user.name}</span>
            <button className="btn-sm" onClick={handleLogout}>[ salir ]</button>
          </div>
        )}
      </div>

      {!user ? (
        <LoginScreen onLogin={handleLogin} prevUsers={prevUsers}/>
      ) : (
        <div className={`layout${flash?" flash":""}`}>

          {/* Left — niveles */}
          <div>
            <div className="sec-hd">NIVELES — PRINCIPIOS S.O.L.I.D.</div>
            <div className="levels">
              {LEVELS.map((lvl, idx) => {
                const pts    = user.scores?.[lvl.id] ?? null;
                const isDone = pts !== null;
                // Unlock logic: primeros 2 siempre disponibles, el resto necesita el anterior
                const locked = idx >= 2 && !user.scores?.[LEVELS[idx-1].id];
                const pct    = isDone ? Math.round((pts/lvl.maxScore)*100) : 0;

                return (
                  <div
                    key={lvl.id}
                    className={`lcard ${locked?"locked":"avail"} ${isDone?"done":""}`}
                    style={{
                      borderColor: isDone ? "var(--dim)" : undefined,
                    }}
                    onClick={() => !locked && setModal(lvl)}
                  >
                    {/* accent bar via inline style trick */}
                    <div style={{
                      position:"absolute",left:0,top:0,bottom:0,
                      width: document.querySelector(`.lcard[data-id="${lvl.id}"]`)?.matches(":hover") ? 3 : 0,
                      background: lvl.color, transition:"width .2s"
                    }}/>

                    <div className="l-letter"
                      style={{color: locked ? "var(--muted)" : lvl.color}}>
                      {lvl.letter}
                    </div>

                    <div>
                      <div className="l-name"
                        style={{color: locked ? "var(--muted)" : "var(--text)"}}>
                        {lvl.name.toUpperCase()}
                      </div>
                      <div className="l-desc">{lvl.desc}</div>
                      <div className="l-tag" style={{color:lvl.color,borderColor:lvl.color}}>
                        {lvl.short} — nivel {idx+1}
                      </div>
                    </div>

                    <div className="l-score">
                      {locked ? (
                        <div style={{fontSize:20,opacity:.4,textAlign:"right"}}>🔒</div>
                      ) : (
                        <>
                          <div className="l-pts"
                            style={{color: isDone ? lvl.color : "var(--muted)"}}>
                            {isDone ? pts : "---"}
                          </div>
                          <div className="l-pts-lbl">PUNTOS</div>
                          <div className="l-bar">
                            <div className="l-bar-fill"
                              style={{
                                width:`${pct}%`,
                                background: lvl.color,
                                boxShadow: isDone ? `0 0 5px ${lvl.color}` : "none"
                              }}/>
                          </div>
                        </>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Right — sidebar */}
          <div className="sidebar">

            {/* Score total */}
            <div className="sbox">
              <div className="sec-hd">TU PROGRESO</div>
              <div className="total-num">{total}</div>
              <div className="total-lbl">PUNTOS TOTALES</div>
              <div className="lvl-done" style={{marginTop:6}}>
                <b>{done}</b> / {LEVELS.length} niveles completados
              </div>
              <div className="solid-bar">
                {LEVELS.map(lvl => (
                  <div key={lvl.id} className={`sdot${user.scores?.[lvl.id]!=null?" on":""}`}
                    style={user.scores?.[lvl.id]!=null
                      ? {background:lvl.color,color:lvl.color}
                      : {}}
                    title={lvl.short}/>
                ))}
              </div>
            </div>

            {/* Leaderboard */}
            <LeaderboardPanel me={user.name} board={board}/>

            {/* Instrucciones */}
            <div className="sbox">
              <div className="sec-hd">CÓMO FUNCIONA</div>
              <div className="help-row">
                <span>1.</span>
                <span>Jugá el nivel en <b>Pygame</b> y anotá tu puntaje final.</span>
              </div>
              <div className="help-row">
                <span>2.</span>
                <span>Hacé click en el nivel acá e ingresá el número.</span>
              </div>
              <div className="help-row">
                <span>3.</span>
                <span>El score se guarda localmente y sube al leaderboard.</span>
              </div>
              <div className="help-row" style={{marginTop:8}}>
                <span>★</span>
                <span>Máx. por nivel: <b style={{color:"var(--green)"}}>700 pts</b> — Total: <b style={{color:"var(--green)"}}>3500 pts</b></span>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Modal */}
      {modal && (
        <ScoreModal
          level={modal}
          current={user.scores?.[modal.id] ?? 0}
          onSave={(pts) => handleSave(modal, pts)}
          onClose={() => setModal(null)}
        />
      )}

      <Toast msg={toast.msg} show={toast.show}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
