name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pygbag
        run: pip install pygbag==0.9.2

      - name: Build WebAssembly
        # Pygbag empaqueta main.py y todas las dependencias en /build/web/
        run: python -m pygbag --build --ume_block 0 --template noctx.tmpl .

      - name: Copy Score Tracker to build output
        # El Score Tracker queda en la raíz; el juego en /game/
        run: |
          mkdir -p build/web/game
          cp -r build/web/* build/web/game/ 2>/dev/null || true
          cp index.html build/web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
